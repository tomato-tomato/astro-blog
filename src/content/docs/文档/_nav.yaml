# 文档册《文档》的左侧目录配置。
#
# title：顶部总标题，纯文本，不参与收起 / 展开；这里直接取文档册的总标题；
# label：目录里显示的文字，与文档标题解耦，可以自己改写；
# doc：  文档 id 去掉「文档/」后的部分，填了就是可点击入口；
# children：子节点，可以继续套 children，任意层级。
#
# 注意 YAML 缩进：children 下的每个「-」要对齐；
# 同一个节点里 doc 与 children 只能二选一。
# 每篇已发布文档都必须在这里出现一次，漏配或重复会在构建期报错。
title: 文档

items:
  - label: 内容写作
    children:
      - label: Markdown 语法
        children:
          - label: 语法指南
            doc: markdown-style-guide
      - label: MDX 介绍
        children:
          - label: 使用 MDX
            doc: using-mdx
  - label: 内容写作2
    children:
      - label: Markdown 语法2,测试长文本超过两行的文本应该需要省略
      - label: MDX 介绍 2
